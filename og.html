<!doctype html><html lang="ja"><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(145deg,#3a0f7a,#6a24c8 55%,#9d4edd);color:#fff;
 font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;position:relative;overflow:hidden}
.stripes{position:absolute;inset:0;opacity:.13;background:repeating-linear-gradient(115deg,transparent 0 34px,rgba(255,255,255,.7) 34px 37px)}
.wrap{position:relative;text-align:center;padding:0 60px}
.badge{display:inline-block;font:900 20px/1 system-ui;letter-spacing:.2em;padding:10px 20px;border:2px solid rgba(255,255,255,.5);border-radius:999px;margin-bottom:28px}
h1{font-size:104px;font-weight:900;letter-spacing:-.02em;line-height:1}
h1 i{font-style:italic;font-family:"Helvetica Neue",Arial;opacity:.95}
p{font-size:34px;font-weight:700;margin-top:26px;opacity:.95}
.meta{margin-top:34px;font-size:24px;font-weight:700;opacity:.85;display:flex;gap:28px;justify-content:center}
.meta span{background:rgba(255,255,255,.16);padding:10px 22px;border-radius:999px}
</style>
<div class="stripes"></div>
<div class="wrap">
  <div class="badge">24H 頭のジム</div>
  <h1>宅建<i>GYM</i></h1>
  <p>スキマ時間で、宅建に受かる。</p>
  <div class="meta"><span>4択 103問</span><span>○× 84問</span><span>本試験形式の模試</span></div>
</div>
</html>
